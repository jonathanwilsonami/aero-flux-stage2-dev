[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aeroflux"
version = "0.1.0"
description = "AeroFlux — real-time flight-delay intelligence platform (parser + ML)."
authors = ["AeroFlux Team <team@example.com>"]
readme = "README.md"
packages = [
  { include = "aeroflux_ml" },
  { include = "aeroflux_parser" },
]
include = ["aeroflux_parser/data/airlines.csv"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
certifi = "*"
confluent-kafka = "*"
fastparquet = "*"
lightgbm = "*"
matplotlib = "*"
networkx = "*"
numpy = ">=1.24"
pandas = ">=2.0"
polars = ">=1.0"
psycopg = { version = "*", extras = ["binary"] }
python-dotenv = "*"
pyyaml = ">=6"
requests = "*"
scikit-learn = "*"
scipy = "*"
seaborn = "*"
solace-pubsubplus = "*"
statsmodels = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
ipykernel = "*"
jupyterlab = "*"

[tool.poetry.group.ml.dependencies]
xgboost = ">=2.0"
pyarrow = ">=14"

[tool.poetry.group.parser.dependencies]
pydantic = ">=2"

[tool.poetry.scripts]
aeroflux-ml = "aeroflux_ml.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
