[project]
name = "aeroflux-parser"
version = "0.1.0"
description = "Decoupled, streaming-tolerant parser for FAA SWIM XML feeds."
requires-python = ">=3.10"
dependencies = []  # core has no third-party deps by design

[project.optional-dependencies]
dev = ["pytest>=7"]
validate = ["pydantic>=2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aeroflux_parser"]

[tool.setuptools.package-data]
aeroflux_parser = ["data/*.csv"]
