# docker-compose.lightsail.yml — always-on deploy target for the Streamlit
# app on Lightsail. Runs the pre-built GHCR image
# (see ../../.github/workflows/deploy-ui.yml for how it gets built/pushed).
#
# The app is reachable TWO ways on purpose:
#   - directly on :8501 (works even if Caddy/TLS/DNS is broken)
#   - via Caddy on :443 at aeroflux.duckdns.org (automatic Let's Encrypt TLS)
# Caddy is additive, not a gate. If TLS/DNS is misconfigured, the demo is
# still reachable directly; `docker compose -f docker-compose.lightsail.yml
# stop caddy` (or delete the service below) and the app keeps serving.
#
# Deploy via ../../deploy.sh, or manually on the Lightsail box:
#   docker compose -f docker-compose.lightsail.yml pull
#   docker compose -f docker-compose.lightsail.yml up -d
#
# Cloud backend config lives in a `.env` file next to this compose file on
# the box (REMOTE_DIR/.env) — STATE_BACKEND, LAKE_BACKEND, AWS_REGION,
# S3_BUCKET, DYNAMODB_TABLE, and the read-only aeroflux-app
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (env vars, not an AWS profile —
# the container has no ~/.aws). That .env is NEVER committed (gitignored,
# lives only on the box) and NEVER touches the GitHub Action — the Action
# only builds/pushes the image and (optionally) triggers a redeploy over
# SSH; it has no AWS credentials of its own. Omit/empty the .env (or leave
# STATE_BACKEND/LAKE_BACKEND unset in it) to fall back to the existing
# built-in sample-data mode — same escape hatch as always.
services:
  app:
    image: ghcr.io/jonathanwilsonami/aeroflux-ui:${IMAGE_TAG:-latest}
    container_name: aeroflux-ui
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Internal Docker-network address of the agent service below (Level
      # 2 integration, see AGENT_INTEGRATION.md) -- Compose's own DNS
      # resolves "agent" to that container; nothing outside this box's
      # Docker network can reach it. Not secret (it's just this compose
      # file's own internal topology), so it's set directly here rather
      # than needing a line in .env -- can't be forgotten or drift.
      AEROFLUX_AGENT_URL: http://agent:8010/ask
    ports:
      - "8501:8501"    # direct access — always on, independent of Caddy
    # No compose-level healthcheck override -- the image's own Dockerfile
    # HEALTHCHECK (urllib-based; python:3.11-slim has no curl, see that
    # Dockerfile's comment) already does this correctly. A stale curl-based
    # override HERE silently reported "unhealthy" forever despite the app
    # genuinely serving traffic (found 2026-08-14) -- the Dockerfile fix
    # for this exact bug had landed already, but this compose file's own
    # duplicate healthcheck: block was never updated to match, so it kept
    # overriding the correct one. One source of truth now, not two.

  caddy:
    image: caddy:2-alpine
    container_name: aeroflux-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # --- Aviation Operations Analyst agent (Level 2 integration) -----------
  # Internal only, on purpose: neither service below publishes a host
  # port, and Caddy only proxies `app`. The only way to reach the agent
  # is from inside this box's Docker network (i.e. from `app`, via
  # AEROFLUX_AGENT_URL above) -- nothing external can hit it directly.
  # Data access stays sample-based for now (agent/tools.py's
  # data/sample_flights.json) -- swapping to the real S3/DynamoDB read
  # path is a separate fast-follow, see AGENT_INTEGRATION.md.
  agent:
    image: ghcr.io/jonathanwilsonami/aeroflux-agent:${AGENT_IMAGE_TAG:-latest}
    container_name: aeroflux-agent
    restart: unless-stopped
    env_file:
      # GROQ_API_KEY lives here, on the box only -- never committed, never
      # touches the GitHub Action. Not the same file as `app`'s .env
      # above (different service, different secret).
      - path: agent.env
        required: false
    environment:
      # agent-pgvector below, by Compose service-name DNS -- not
      # localhost:5433 (that's only for running the agent outside Docker,
      # e.g. local dev against `agent/docker-compose.yml`).
      DATABASE_URL: postgresql://aeroflux:aeroflux_local_dev@agent-pgvector:5432/aeroflux_rag
    depends_on:
      - agent-pgvector

  agent-pgvector:
    image: pgvector/pgvector:pg16
    container_name: aeroflux-agent-pgvector
    restart: unless-stopped
    environment:
      # Local-dev-only credentials (same as agent/docker-compose.yml) --
      # not real secrets, and not reachable from outside this box's
      # Docker network anyway (no host port published).
      POSTGRES_USER: aeroflux
      POSTGRES_PASSWORD: aeroflux_local_dev
      POSTGRES_DB: aeroflux_rag
    volumes:
      - agent_pgvector_data:/var/lib/postgresql/data
      - ./agent-sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  caddy_data:
  caddy_config:
  agent_pgvector_data:
