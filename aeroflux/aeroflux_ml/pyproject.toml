[project]
name = "aeroflux-ml"
version = "0.1.0"
description = "Modular, config-driven feature engineering + inference for AeroFlux (BTS/live parity)."
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "pyyaml>=6", "numpy>=1.24"]
# weather fetchers additionally need: requests

[project.optional-dependencies]
inference = ["xgboost>=2.0"]
io = ["pyarrow>=14"]
dev = ["pytest>=7", "xgboost>=2.0", "pyarrow>=14"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aeroflux_ml"]

[project.scripts]
aeroflux-ml = "aeroflux_ml.run:main"
