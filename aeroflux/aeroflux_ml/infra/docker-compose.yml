# AeroFlux ML — local stack (SCAFFOLD). Portable, cloud-agnostic: everything
# runs on your machine. MinIO stands in for S3 (same API) so the S3 swap is a
# config change, not a rewrite. Postgres is local dev/metadata/inspection only;
# the production NoSQL state store is DynamoDB or MongoDB.
#
# Bring up:  docker compose -f infra/docker-compose.yml up -d
# This is a starting point — pin versions and harden before relying on it.

services:
  kafka:
    image: apache/kafka:3.8.0          # KRaft mode, no separate Zookeeper
    container_name: aeroflux-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    container_name: aeroflux-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: aeroflux
      POSTGRES_PASSWORD: aeroflux-db
      POSTGRES_DB: aeroflux
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:                                # S3-compatible object store (the "lake")
    image: minio/minio:latest
    container_name: aeroflux-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: aeroflux
      MINIO_ROOT_PASSWORD: aeroflux-minio
    volumes: ["miniodata:/data"]

  spark:                                # standalone Spark for spark-submit jobs
    image: bitnami/spark:3.5
    container_name: aeroflux-spark
    environment:
      SPARK_MODE: master
    ports: ["7077:7077", "8080:8080"]

volumes:
  pgdata:
  miniodata:
